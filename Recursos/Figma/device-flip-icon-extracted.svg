  <rect x="14" y="14" width="2" height="2" rx="0.5" fill="#008380" opacity="0.6"/>
  <rect x="8" y="17" width="2" height="2" rx="0.5" fill="#008380" opacity="0.6"/>
  <rect x="11" y="17" width="2" height="2" rx="0.5" fill="#008380" opacity="0.6"/>
  <rect x="14" y="17" width="2" height="2" rx="0.5" fill="#008380" opacity="0.6"/>
  
